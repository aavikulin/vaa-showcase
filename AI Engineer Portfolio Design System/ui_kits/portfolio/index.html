  button, select { font-family: var(--font); }

      align-items: flex-start;
      gap: 16px;
      padding: 20px 24px !important;

    .nav-links {
      width: 100%;
      flex-wrap: wrap;
      gap: 14px !important;
    }
    .page-shell {
      padding: 0 24px !important;
    }
    .grid-two {
      grid-template-columns: 1fr !important;
    }
    .footer-shell {
      padding: 24px !important;
      gap: 16px;
      flex-direction: column;
      align-items: flex-start !important;
    }
    .writing-row {

function ThemeToggle({ theme, onToggle, copy }) {
  const isDark = theme === "dark";
  const label = isDark ? copy.themeToLight : copy.themeToDark;
  const icon = isDark ? (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="currentColor" />
      <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
    </svg>
  ) : (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20 15.2A8 8 0 1 1 8.8 4a6.5 6.5 0 0 0 11.2 11.2Z" fill="currentColor" />
    </svg>
  );
  return (
    <button
      onClick={onToggle}
      aria-label={label}
      title={label}
      style={{
        fontSize: 12,
        color: "var(--fg-2)",
        background: "var(--bg-2)",
        border: "1px solid var(--border)",
        borderRadius: 999,
        padding: "6px 10px",
        cursor: "pointer",
        lineHeight: 1,
        display: "inline-flex",
        alignItems: "center",
        justifyContent: "center",
      }}
    >
      {icon}
    </button>
  );
}

              onNav && onNav(link.key);
            }}

        <ThemeToggle theme={theme} onToggle={onToggleTheme} copy={ui.toggles} />
      </div>
    </nav>
  );

function Tag({ children, variant = "default" }) {
  const variants = {
    default: { background: "var(--bg-3)", color: "var(--fg-2)", border: "1px solid var(--border)" },
    accent: { background: "var(--accent-subtle)", color: "var(--accent)" },
    green: { background: "var(--green-subtle)", color: "var(--green)" },
    dark: { background: "var(--fg)", color: "var(--bg)" },
  };
  return <span style={{ display: "inline-block", fontSize: 11, padding: "3px 8px", borderRadius: 2, ...variants[variant] }}>{children}</span>;
}

function Button({ children, variant = "primary", size = "md", onClick, href }) {
  const sizeStyles = size === "sm" ? { fontSize: 12, padding: "5px 12px" } : { fontSize: 13, padding: "9px 18px" };
  const variantStyles = {
    primary: { background: "var(--fg)", color: "var(--bg)", border: "none" },
    secondary: { background: "var(--bg-2)", color: "var(--fg)", border: "1px solid var(--border)" },
    ghost: { background: "transparent", color: "var(--accent)", border: "none", paddingLeft: 0, paddingRight: 0 },
  };
  const style = { fontFamily: "var(--font)", borderRadius: 4, cursor: "pointer", ...sizeStyles, ...variantStyles[variant] };
  if (href) return <a href={href} style={{ ...style, textDecoration: "none", display: "inline-block" }}>{children}</a>;
  return <button style={style} onClick={onClick}>{children}</button>;
}

function ProjectCard({ title, year, description, tags = [], link = "#", external = false, ui }) {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      style={{ background: "var(--bg-2)", border: `1px solid ${hovered ? "var(--fg-3)" : "var(--border)"}`, borderRadius: 4, padding: 20, transition: "border-color 150ms" }}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <span style={{ fontSize: 15, fontWeight: 500, color: "var(--fg)" }}>{title}</span>
        <span style={{ fontSize: 11, color: "var(--fg-3)" }}>{year}</span>
      </div>
      <p style={{ fontSize: 13, color: "var(--fg-2)", lineHeight: 1.6, marginBottom: 14 }}>{description}</p>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{tags.map((tag) => <Tag key={tag}>{tag}</Tag>)}</div>
        <a href={link} style={{ fontSize: 12, color: "var(--accent)", textDecoration: "none", flexShrink: 0 }}>
          {external ? ui.viewExternal : ui.viewProject}
        </a>
      </div>
    </div>
  );
}

      <div>
        <a href={link} style={{ fontSize: 14, color: "var(--fg)", textDecoration: hovered ? "underline" : "none" }}>{title}</a>

      <span style={{ fontSize: 11, color: "var(--fg-3)", flexShrink: 0, marginLeft: 24 }}>{date} · {readTime}</span>

}

    outline: "none",

    display: "block",
    boxSizing: "border-box",
  };

            title={label}
            style={{ color: "var(--fg-3)", display: "flex" }}
            onMouseEnter={(e) => { e.currentTarget.style.color = "var(--fg)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.color = "var(--fg-3)"; }}
          >
            {icon}
          </a>
        ))}
      </div>
    </footer>
  );
}

function AboutPage({ name, ui, projects }) {
  return (
    <div className="page-shell" style={{ maxWidth: 720, margin: "0 auto", padding: "0 48px" }}>
      <Section title={ui.sections.about}>
        <div style={{ marginBottom: 48 }}>
          <h1 style={{ fontSize: 36, fontWeight: 500, lineHeight: 1.2, letterSpacing: "-0.01em", color: "var(--fg)", marginBottom: 24 }}>
            {name}
          </h1>
          <p style={{ fontSize: 16, color: "var(--fg)", lineHeight: 1.7, marginBottom: 16, maxWidth: 560 }}>
            {ui.about.intro}
          </p>
          <p style={{ fontSize: 15, color: "var(--fg-2)", lineHeight: 1.7, marginBottom: 16, maxWidth: 560 }}>
            {ui.about.summary}
          </p>
          <div style={{ display: "flex", gap: 16, marginTop: 24, flexWrap: "wrap" }}>
            <Button href="#">{ui.about.viewWork}</Button>
            <Button variant="secondary">{ui.about.getInTouch}</Button>
          </div>
        </div>
      </Section>

      <Section title={ui.sections.recentWork}>
        <div className="grid-two" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {projects.slice(0, 2).map((project) => <ProjectCard key={project.title} {...project} ui={ui.card} />)}
        </div>
      </Section>

      <Section title={ui.sections.stack}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {["python", "pytorch", "transformers", "fastapi", "postgres", "pgvector", "redis", "docker", "k8s"].map((tag) => (
            <Tag key={tag}>{tag}</Tag>
          ))}
        </div>
      </Section>
    </div>
  );
}

function WorkPage({ ui, projects }) {
  return (
    <div className="page-shell" style={{ maxWidth: 720, margin: "0 auto", padding: "0 48px" }}>
      <Section title={ui.sections.work}>
        <p style={{ fontSize: 15, color: "var(--fg-2)", marginBottom: 32 }}>{ui.work.intro}</p>
        <div className="grid-two" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {projects.map((project) => <ProjectCard key={project.title} {...project} ui={ui.card} />)}
        </div>
      </Section>

  );

function WritingPage({ ui, posts }) {
  return (
    <div className="page-shell" style={{ maxWidth: 720, margin: "0 auto", padding: "0 48px" }}>
      <Section title={ui.sections.writing}>
        <p style={{ fontSize: 15, color: "var(--fg-2)", marginBottom: 32 }}>{ui.writing.intro}</p>
        <div>
          {posts.map((post) => <WritingRow key={post.title} {...post} />)}
        </div>

function ContactPage({ ui }) {
  return (
    <div className="page-shell" style={{ maxWidth: 720, margin: "0 auto", padding: "0 48px" }}>
      <Section title={ui.sections.contact}>
        <p style={{ fontSize: 15, color: "var(--fg-2)", lineHeight: 1.7, marginBottom: 32, maxWidth: 440 }}>
          {ui.contact.intro}
        </p>
        <ContactForm ui={ui.contact} />
      </Section>
    </div>

function App() {
  const savedPage = localStorage.getItem("portfolio-page");
  const savedTheme = localStorage.getItem("portfolio-theme");
  const savedLanguage = localStorage.getItem("portfolio-language");
  const initialTheme = savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const initialLanguage = savedLanguage || "en";

  const [page, setPage] = useState(savedPage || "about");
  const [theme, setTheme] = useState(initialTheme);
  const [language, setLanguage] = useState(initialLanguage);
  const [name, setName] = useState("alex chen");

  const ui = UI[language];
  const projects = PROJECTS[language];
  const posts = POSTS[language];
  const navLinks = [
    { key: "about", label: ui.nav.about },
    { key: "work", label: ui.nav.work },
    { key: "writing", label: ui.nav.writing },
    { key: "contact", label: ui.nav.contact },
  ];

  useEffect(() => { localStorage.setItem("portfolio-page", page); }, [page]);
  useEffect(() => { localStorage.setItem("portfolio-theme", theme); }, [theme]);
  useEffect(() => { localStorage.setItem("portfolio-language", language); }, [language]);
  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
  useEffect(() => { document.documentElement.lang = ui.htmlLang; }, [ui]);

  useEffect(() => {
    const nameEl = document.getElementById("tweak-name");
    const themeEl = document.getElementById("tweak-theme");
    const languageEl = document.getElementById("tweak-language");
    const pageEl = document.getElementById("tweak-page");

    const handleName = (e) => setName(e.target.value);
    const handleTheme = (e) => setTheme(e.target.value);
    const handleLanguage = (e) => setLanguage(e.target.value);
    const handlePage = (e) => setPage(e.target.value);

    if (nameEl) nameEl.addEventListener("input", handleName);
    if (themeEl) themeEl.addEventListener("change", handleTheme);
    if (languageEl) languageEl.addEventListener("change", handleLanguage);
    if (pageEl) pageEl.addEventListener("change", handlePage);

    const handleMessage = (e) => {
      if (e.data?.type === "__activate_edit_mode") document.getElementById("tweaks-panel")?.classList.add("visible");
      if (e.data?.type === "__deactivate_edit_mode") document.getElementById("tweaks-panel")?.classList.remove("visible");
    };

    window.addEventListener("message", handleMessage);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");

    return () => {
      if (nameEl) nameEl.removeEventListener("input", handleName);
      if (themeEl) themeEl.removeEventListener("change", handleTheme);
      if (languageEl) languageEl.removeEventListener("change", handleLanguage);
      if (pageEl) pageEl.removeEventListener("change", handlePage);
      window.removeEventListener("message", handleMessage);
    };
  }, []);

  useEffect(() => {
    const nameLabel = document.querySelector('label[for="tweak-name"]');
    if (nameLabel) nameLabel.textContent = ui.tweakPanel.name;
  }, [ui]);

  useEffect(() => {
    const themeEl = document.getElementById("tweak-theme");
    const languageEl = document.getElementById("tweak-language");
    const pageEl = document.getElementById("tweak-page");

    if (themeEl) themeEl.value = theme;
    if (languageEl) languageEl.value = language;
    if (pageEl) pageEl.value = page;

    const tweakLabels = document.querySelectorAll("#tweaks-panel label span");
    if (tweakLabels[0]) tweakLabels[0].textContent = ui.tweakPanel.name;
    if (tweakLabels[1]) tweakLabels[1].textContent = ui.tweakPanel.mode;
    if (tweakLabels[2]) tweakLabels[2].textContent = ui.tweakPanel.language;
    if (tweakLabels[3]) tweakLabels[3].textContent = ui.tweakPanel.activePage;

    if (pageEl) {
      Array.from(pageEl.options).forEach((option) => {
        option.text = ui.tweakPanel.pages[option.value];
      });
    }
  }, [theme, language, page, ui]);

  const pages = {
    about: <AboutPage name={name} ui={ui} projects={projects} />,
    work: <WorkPage ui={ui} projects={projects} />,
    writing: <WritingPage ui={ui} posts={posts} />,
    contact: <ContactPage ui={ui} />,
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <Nav
        name={name}
        links={navLinks}
        active={page}
        theme={theme}
        language={language}
        ui={ui}
        onToggleTheme={() => {
          const nextTheme = theme === "dark" ? "light" : "dark";
          setTheme(nextTheme);
        }}
        onToggleLanguage={() => {
          const nextLanguage = language === "en" ? "ru" : "en";
          setLanguage(nextLanguage);
        }}
        onNav={(nextPage) => {
          setPage(nextPage);
        }}
      />
      <main style={{ flex: 1, paddingTop: 0 }}>
        {pages[page] || pages.about}
      </main>
      <Footer name={name} ui={ui.footer} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
