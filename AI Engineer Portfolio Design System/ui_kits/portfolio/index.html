<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font: 'JetBrains Mono', Consolas, 'Courier New', monospace;
    --bg: #FAFAF9; --bg-2: #F2F2F0; --bg-3: #E8E8E6;
    --fg: #111110; --fg-2: #6B6B69; --fg-3: #ABABAA;
    --border: #E2E2E0; --border-2: #CECECE;
    --accent: #1C64F2; --accent-hover: #1A56DB; --accent-subtle: #EFF6FF;
    --green: #059669; --green-subtle: #ECFDF5;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 4px; --radius-sm: 2px;
  }
  [data-theme="dark"] {
    --bg: #111110; --bg-2: #1C1C1B; --bg-3: #282826;
    --fg: #F0F0EE; --fg-2: #8A8A88; --fg-3: #555554;
    --border: #2A2A28; --border-2: #3A3A38;
    --accent: #3B82F6; --accent-hover: #60A5FA; --accent-subtle: #1E3A5F;
    --green: #34D399; --green-subtle: #064E3B;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }
  html, body, #root { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; transition: background 200ms, color 200ms; }
  * { font-family: var(--font); }
  a { color: inherit; }
  button { font-family: var(--font); }
  ::selection { background: #BFDBFE; }

  /* Tweaks panel */
  #tweaks-panel {
    display: none; position: fixed; bottom: 24px; right: 24px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 16px; width: 220px;
    box-shadow: var(--shadow-md); z-index: 1000; font-size: 12px; color: var(--fg-2);
  }
  #tweaks-panel.visible { display: block; }
  #tweaks-panel label { display: block; margin-bottom: 10px; }
  #tweaks-panel span { display: block; margin-bottom: 4px; color: var(--fg-3); font-size: 11px; }
  #tweaks-panel select, #tweaks-panel input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    padding: 5px 8px; color: var(--fg); font-size: 12px; font-family: var(--font);
  }
  #tweaks-panel input[type=checkbox] { margin-right: 6px; }
  .tweaks-title { font-size: 11px; font-weight: 500; color: var(--fg); margin-bottom: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <div class="tweaks-title">Tweaks</div>
  <label><span>Name</span><input type="text" id="tweak-name" value="alex chen"></label>
  <label><span>Mode</span>
    <select id="tweak-theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <label><span>Active page</span>
    <select id="tweak-page">
      <option value="about">about</option>
      <option value="work">work</option>
      <option value="writing">writing</option>
      <option value="contact">contact</option>
    </select>
  </label>
</div>

<script type="text/babel">
/*
 * AI Engineer Portfolio - UI Kit Shared Components
 */
const { useState } = React;

function ThemeToggle({ theme, onToggle }) {
  const isDark = theme === "dark";
  return (
    <button
      onClick={onToggle}
      aria-label={isDark ? "Switch to light theme" : "Switch to dark theme"}
      title={isDark ? "Switch to light theme" : "Switch to dark theme"}
      style={{
        fontSize: 12,
        color: "var(--fg-2)",
        background: "var(--bg-2)",
        border: "1px solid var(--border)",
        borderRadius: 999,
        padding: "6px 10px",
        cursor: "pointer",
        lineHeight: 1,
      }}
    >
      {isDark ? "light" : "dark"}
    </button>
  );
}

function Nav({ name="alex chen", links=["about","work","writing","contact"], active="about", onNav, theme="light", onToggleTheme }) {
  return (
    <nav style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'20px 48px',borderBottom:'1px solid var(--border)',background:'var(--bg)'}}>
      <span style={{fontSize:15,fontWeight:500,color:'var(--fg)',letterSpacing:'-0.01em'}}>
        {name}<span style={{display:'inline-block',width:2,height:'1em',background:'var(--accent)',marginLeft:1,verticalAlign:'text-bottom'}}/>
      </span>
      <div style={{display:'flex',gap:20,alignItems:'center'}}>
        {links.map(l=>(
          <a key={l} href="#" style={{fontSize:13,color:active===l?'var(--fg)':'var(--fg-2)',textDecoration:'none',cursor:'pointer'}}
             onClick={e=>{e.preventDefault();onNav&&onNav(l)}}>{l}</a>
        ))}
        <ThemeToggle theme={theme} onToggle={onToggleTheme} />
      </div>
    </nav>
  );
}

function Tag({ children, variant="default" }) {
  const v = {
    default:{background:'var(--bg-3)',color:'var(--fg-2)',border:'1px solid var(--border)'},
    accent: {background:'var(--accent-subtle)',color:'var(--accent)'},
    green:  {background:'var(--green-subtle)',color:'var(--green)'},
    dark:   {background:'var(--fg)',color:'var(--bg)'},
  };
  return <span style={{display:'inline-block',fontSize:11,padding:'3px 8px',borderRadius:2,...v[variant]}}>{children}</span>;
}

function Button({ children, variant="primary", size="md", onClick, href }) {
  const sz = size==='sm'?{fontSize:12,padding:'5px 12px'}:{fontSize:13,padding:'9px 18px'};
  const vr = {
    primary:  {background:'var(--fg)',color:'var(--bg)',border:'none'},
    secondary:{background:'var(--bg-2)',color:'var(--fg)',border:'1px solid var(--border)'},
    ghost:    {background:'transparent',color:'var(--accent)',border:'none',paddingLeft:0,paddingRight:0},
  };
  const s = {fontFamily:'var(--font)',borderRadius:4,cursor:'pointer',...sz,...vr[variant]};
  if(href) return <a href={href} style={{...s,textDecoration:'none',display:'inline-block'}}>{children}</a>;
  return <button style={s} onClick={onClick}>{children}</button>;
}

function ProjectCard({ title, year, description, tags=[], link="#", external=false }) {
  const [hov,setHov] = useState(false);
  return (
    <div style={{background:'var(--bg-2)',border:`1px solid ${hov?'var(--fg-3)':'var(--border)'}`,borderRadius:4,padding:20,transition:'border-color 150ms'}}
         onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}}>
        <span style={{fontSize:15,fontWeight:500,color:'var(--fg)'}}>{title}</span>
        <span style={{fontSize:11,color:'var(--fg-3)'}}>{year}</span>
      </div>
      <p style={{fontSize:13,color:'var(--fg-2)',lineHeight:1.6,marginBottom:14}}>{description}</p>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{tags.map(t=><Tag key={t}>{t}</Tag>)}</div>
        <a href={link} style={{fontSize:12,color:'var(--accent)',textDecoration:'none'}}>{external?'view ↗':'view project →'}</a>
      </div>
    </div>
  );
}

function WritingRow({ title, date, readTime, tags=[], link="#" }) {
  const [hov,setHov] = useState(false);
  return (
    <div style={{padding:'16px 0',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'baseline'}}
         onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      <div>
        <a href={link} style={{fontSize:14,color:'var(--fg)',textDecoration:hov?'underline':'none'}}>{title}</a>
        <div style={{marginTop:6,display:'flex',gap:6}}>{tags.map(t=><Tag key={t}>{t}</Tag>)}</div>
      </div>
      <span style={{fontSize:11,color:'var(--fg-3)',flexShrink:0,marginLeft:24}}>{date} · {readTime}</span>
    </div>
  );
}

function Section({ title, children, id }) {
  return (
    <section id={id} style={{padding:'64px 0',borderBottom:'1px solid var(--border)'}}>
      <h2 style={{fontSize:11,color:'var(--fg-3)',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:32}}>{title}</h2>
      {children}
    </section>
  );
}

function ContactForm() {
  const [sent,setSent] = useState(false);
  const inp = {fontFamily:'var(--font)',fontSize:13,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:4,padding:'9px 12px',color:'var(--fg)',width:'100%',outline:'none',marginBottom:10,display:'block',boxSizing:'border-box'};
  if(sent) return <p style={{fontSize:14,color:'var(--green)'}}>message sent →</p>;
  return (
    <div style={{maxWidth:480}}>
      <input style={inp} placeholder="your@email.com" type="email"/>
      <textarea style={{...inp,resize:'vertical',minHeight:100}} placeholder="tell me about the project..."/>
      <Button onClick={()=>setSent(true)}>send message →</Button>
    </div>
  );
}

function Footer({ name="alex chen" }) {
  const ghIcon = <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.604-3.369-1.341-3.369-1.341-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>;
  const liIcon = <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>;
  return (
    <footer style={{padding:'32px 48px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span style={{fontSize:12,color:'var(--fg-3)'}}>© {new Date().getFullYear()} {name}</span>
      <div style={{display:'flex',gap:20}}>
        {[['GitHub',ghIcon],['LinkedIn',liIcon]].map(([label,icon])=>(
          <a key={label} href="#" title={label} style={{color:'var(--fg-3)',display:'flex'}}
             onMouseEnter={e=>e.currentTarget.style.color='var(--fg)'}
             onMouseLeave={e=>e.currentTarget.style.color='var(--fg-3)'}>{icon}</a>
        ))}
      </div>
    </footer>
  );
}

Object.assign(window, { Nav, Tag, Button, ProjectCard, WritingRow, Section, ContactForm, Footer });
</script>
<script type="text/babel">
const { useState, useEffect } = React;

const PROJECTS = [
  { title:"RAG pipeline for enterprise search", year:"2024", description:"Retrieval-augmented generation over internal docs using pgvector, re-ranking, and structured outputs.", tags:["python","rag","postgres"], external:false },
  { title:"LLM eval harness", year:"2024", description:"Framework for running evals across model checkpoints. Supports custom metrics, dataset versioning, and CI integration.", tags:["python","evals","llm"], external:false },
  { title:"fine-tune-llama", year:"2023", description:"Open-source toolkit for LoRA fine-tuning on consumer GPUs. 1.2k GitHub stars.", tags:["pytorch","lora","open source"], external:true },
  { title:"semantic search API", year:"2023", description:"Production-ready embedding API with caching, batching, and multi-model support. Handles 10k req/day.", tags:["fastapi","embeddings","vector"], external:false },
];

const POSTS = [
  { title:"Fine-tuning Llama 3 on domain data without losing general capability", date:"Mar 2024", readTime:"8 min read", tags:["llm","lora"] },
  { title:"Building reliable evals: what I learned after 6 months", date:"Jan 2024", readTime:"6 min read", tags:["evals"] },
  { title:"pgvector vs Pinecone: a practical comparison for RAG", date:"Nov 2023", readTime:"5 min read", tags:["rag","vector db"] },
  { title:"Why I stopped using LangChain", date:"Sep 2023", readTime:"4 min read", tags:["opinion"] },
];

function AboutPage({ name }) {
  return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'0 48px'}}>
      <Section title="about">
        <div style={{marginBottom:48}}>
          <h1 style={{fontSize:36,fontWeight:500,lineHeight:1.2,letterSpacing:'-0.01em',color:'var(--fg)',marginBottom:24}}>
            {name}
          </h1>
          <p style={{fontSize:16,color:'var(--fg)',lineHeight:1.7,marginBottom:16,maxWidth:560}}>
            I build systems at the intersection of language models and software engineering.
          </p>
          <p style={{fontSize:15,color:'var(--fg-2)',lineHeight:1.7,marginBottom:16,maxWidth:560}}>
            Currently focused on retrieval, agents, and making LLMs reliable in production. Previously at a Series B startup building developer tools. Open to interesting problems.
          </p>
          <div style={{display:'flex',gap:16,marginTop:24}}>
            <Button href="#">view work →</Button>
            <Button variant="secondary">get in touch</Button>
          </div>
        </div>
      </Section>

      <Section title="recent work">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {PROJECTS.slice(0,2).map(p=><ProjectCard key={p.title} {...p}/>)}
        </div>
      </Section>

      <Section title="stack">
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {["python","pytorch","transformers","fastapi","postgres","pgvector","redis","docker","k8s"].map(t=>(
            <Tag key={t}>{t}</Tag>
          ))}
        </div>
      </Section>
    </div>
  );
}

function WorkPage() {
  return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'0 48px'}}>
      <Section title="work">
        <p style={{fontSize:15,color:'var(--fg-2)',marginBottom:32}}>A few things I've built recently.</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {PROJECTS.map(p=><ProjectCard key={p.title} {...p}/>)}
        </div>
      </Section>
    </div>
  );
}

function WritingPage() {
  return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'0 48px'}}>
      <Section title="writing">
        <p style={{fontSize:15,color:'var(--fg-2)',marginBottom:32}}>Notes on what I'm figuring out.</p>
        <div>
          {POSTS.map(p=><WritingRow key={p.title} {...p}/>)}
        </div>
      </Section>
    </div>
  );
}

function ContactPage() {
  return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'0 48px'}}>
      <Section title="contact">
        <p style={{fontSize:15,color:'var(--fg-2)',lineHeight:1.7,marginBottom:32,maxWidth:440}}>
          If you're working on something interesting — a hard retrieval problem, a novel agent architecture, or just want to talk AI engineering — get in touch.
        </p>
        <ContactForm/>
      </Section>
    </div>
  );
}

function App() {
  const saved = localStorage.getItem('portfolio-page');
  const savedTheme = localStorage.getItem('portfolio-theme');
  const initialTheme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const [page, setPage] = useState(saved || 'about');
  const [theme, setTheme] = useState(initialTheme);
  const [name, setName] = useState('alex chen');

  useEffect(() => { localStorage.setItem('portfolio-page', page); }, [page]);
  useEffect(() => { localStorage.setItem('portfolio-theme', theme); }, [theme]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  // Tweaks wiring
  useEffect(() => {
    const nameEl = document.getElementById('tweak-name');
    const themeEl = document.getElementById('tweak-theme');
    const pageEl = document.getElementById('tweak-page');
    if (nameEl) nameEl.addEventListener('input', e => setName(e.target.value));
    if (themeEl) themeEl.addEventListener('change', e => setTheme(e.target.value));
    if (pageEl) pageEl.addEventListener('change', e => setPage(e.target.value));

    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel')?.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel')?.classList.remove('visible');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    if (themeEl) themeEl.value = initialTheme;
  }, []);

  const pages = { about: <AboutPage name={name}/>, work: <WorkPage/>, writing: <WritingPage/>, contact: <ContactPage/> };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Nav
        name={name}
        active={page}
        theme={theme}
        onToggleTheme={() => {
          const nextTheme = theme === 'dark' ? 'light' : 'dark';
          setTheme(nextTheme);
          const themeEl = document.getElementById('tweak-theme');
          if (themeEl) themeEl.value = nextTheme;
        }}
        onNav={p => {
          setPage(p);
          document.getElementById('tweak-page').value = p;
        }}
      />
      <main style={{flex:1,paddingTop:0}}>
        {pages[page] || pages.about}
      </main>
      <Footer name={name}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
