<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'JetBrains Mono', monospace; background: #FAFAF9; padding: 20px 24px; }
  .label { font-size: 10px; color: #ABABAA; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }

  input, textarea {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: #FAFAF9;
    border: 1px solid #E2E2E0;
    border-radius: 4px;
    padding: 9px 12px;
    color: #111110;
    width: 100%;
    outline: none;
    transition: border-color 150ms ease;
    display: block;
    margin-bottom: 10px;
  }
  input::placeholder, textarea::placeholder { color: #ABABAA; }
  input:focus, textarea:focus { border-color: #1C64F2; }
  .input-error { border-color: #DC2626; }
  .error-msg { font-size: 11px; color: #DC2626; margin-top: -8px; margin-bottom: 10px; }
  textarea { resize: vertical; min-height: 80px; }
</style>
</head>
<body>
  <div class="label">Default</div>
  <input type="text" placeholder="your@email.com">

  <div class="label">Focused (blue border)</div>
  <input type="text" value="alex@example.com" style="border-color:#1C64F2">

  <div class="label">Error</div>
  <input type="text" value="not-an-email" class="input-error">
  <div class="error-msg">please enter a valid email address</div>

  <div class="label">Textarea</div>
  <textarea placeholder="tell me about the project..."></textarea>
</body>
</html>
