<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'JetBrains Mono', monospace; background: #FAFAF9; padding: 24px; }
  .label { font-size: 10px; color: #ABABAA; text-transform: uppercase; letter-spacing:.04em; margin-bottom: 12px; margin-top: 18px; }
  .label:first-child { margin-top: 0; }

  /* Wordmark */
  .wordmark { font-size: 22px; font-weight: 500; color: #111110; letter-spacing: -0.01em; }
  .wordmark .cursor { display: inline-block; width: 2px; height: 1em; background: #1C64F2; margin-left: 1px; vertical-align: text-bottom; }

  /* Social icons (SVG inline) */
  .socials { display: flex; gap: 16px; align-items: center; }
  .socials a { color: #6B6B69; transition: color 150ms; display: flex; }
  .socials a:hover { color: #111110; }

  /* Divider with label */
  .divider { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .divider hr { flex: 1; border: none; border-top: 1px solid #E2E2E0; }
  .divider span { font-size: 11px; color: #ABABAA; }

  /* Unicode arrows usage */
  .arrows { display: flex; gap: 24px; font-size: 14px; }
  .arrows span { color: #6B6B69; }
  .arrows .sym { color: #111110; font-weight: 500; margin-right: 4px; }
</style>
</head>
<body>
  <div class="label">Wordmark / logotype</div>
  <div class="wordmark">alex chen<span class="cursor"></span></div>

  <div class="label" style="margin-top:20px">Social / icon SVGs</div>
  <div class="socials">
    <!-- GitHub -->

      </svg>
    </a>
    <!-- LinkedIn -->
    <a href="#" title="LinkedIn">

        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>

    <a href="#" title="Email">

        <rect x="2" y="4" width="20" height="16" rx="2"/>

  </div>

  <div class="label">Unicode navigation arrows</div>
  <div class="arrows">
    <span><span class="sym">→</span> navigate / CTA</span>
    <span><span class="sym">↗</span> external link</span>
    <span><span class="sym">←</span> back</span>
  </div>
</body>
</html>
