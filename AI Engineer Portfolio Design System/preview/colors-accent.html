<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'JetBrains Mono', monospace; background: #FAFAF9; padding: 20px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .swatch { width: 48px; height: 48px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.07); }
  .swatch-wide { height: 32px; border-radius: 3px; flex: 1; border: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; padding: 0 10px; font-size: 10px; color: #6B6B69; font-family: 'JetBrains Mono', monospace; }
  .name { font-size: 11px; font-weight: 500; color: #111110; }
  .hex  { font-size: 10px; color: #6B6B69; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .section-title { font-size: 10px; letter-spacing: 0.06em; color: #ABABAA; text-transform: uppercase; margin-bottom: 8px; margin-top: 2px; }
  .chip { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; margin-right: 6px; }
</style>
</head>
<body>
<div class="section-title">Accent — Blue</div>
<div class="row"><div class="swatch" style="background:#1C64F2"></div><div class="info"><span class="name">--accent</span><span class="hex">#1C64F2</span></div></div>
<div class="row"><div class="swatch" style="background:#1A56DB"></div><div class="info"><span class="name">--accent-hover</span><span class="hex">#1A56DB</span></div></div>
<div class="row"><div class="swatch" style="background:#EFF6FF"></div><div class="info"><span class="name">--accent-subtle</span><span class="hex">#EFF6FF</span></div></div>

<div class="section-title" style="margin-top:14px">Terminal Green</div>
<div class="row"><div class="swatch" style="background:#059669"></div><div class="info"><span class="name">--green</span><span class="hex">#059669</span></div></div>
<div class="row"><div class="swatch" style="background:#ECFDF5"></div><div class="info"><span class="name">--green-subtle</span><span class="hex">#ECFDF5</span></div></div>

<div class="section-title" style="margin-top:14px">In use</div>
<div style="display:flex; gap:8px; flex-wrap:wrap;">
  <span class="chip" style="background:#EFF6FF; color:#1C64F2">python</span>
  <span class="chip" style="background:#EFF6FF; color:#1C64F2">view project →</span>
  <span class="chip" style="background:#ECFDF5; color:#059669">available</span>
  <span class="chip" style="background:#E8E8E6; color:#6B6B69">2024</span>
</div>
</body>
</html>
