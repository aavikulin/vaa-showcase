<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'JetBrains Mono', monospace; background: #FAFAF9; padding: 20px 24px; }
  .label { font-size: 10px; color: #ABABAA; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; margin-top: 14px; }
  .label:first-child { margin-top: 0; }

  .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; }
  .tag-default { background: #F2F2F0; color: #6B6B69; border: 1px solid #E2E2E0; }
  .tag-accent  { background: #EFF6FF; color: #1C64F2; }
  .tag-green   { background: #ECFDF5; color: #059669; }
  .tag-dark    { background: #111110; color: #F0F0EE; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 8px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="label">Tech tags</div>
  <div class="row">
    <span class="tag tag-default">python</span>
    <span class="tag tag-default">pytorch</span>
    <span class="tag tag-default">rag</span>
    <span class="tag tag-default">llm</span>
    <span class="tag tag-accent">featured</span>
    <span class="tag tag-green">open source</span>
    <span class="tag tag-dark">new</span>
  </div>

  <div class="label">Status badges</div>
  <div class="row">
    <span class="badge" style="background:#ECFDF5;color:#059669"><span class="dot" style="background:#059669"></span>available</span>
    <span class="badge" style="background:#F2F2F0;color:#6B6B69"><span class="dot" style="background:#ABABAA"></span>in progress</span>
    <span class="badge" style="background:#EFF6FF;color:#1C64F2"><span class="dot" style="background:#1C64F2"></span>active</span>
  </div>

  <div class="label">Date / meta chips</div>
  <div class="row">
    <span class="tag tag-default">2024</span>
    <span class="tag tag-default">Jan 2024</span>
    <span class="tag tag-default">4 min read</span>
    <span style="font-size:11px;color:#ABABAA;padding:3px 0">↗ external</span>
  </div>
</body>
</html>
