<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'JetBrains Mono', monospace; background: #111110; padding: 20px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .swatch { width: 44px; height: 44px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); }
  .name { font-size: 11px; font-weight: 500; color: #F0F0EE; }
  .hex  { font-size: 10px; color: #8A8A88; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .section-title { font-size: 10px; letter-spacing: 0.06em; color: #555554; text-transform: uppercase; margin-bottom: 8px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
</style>
</head>
<body>
<div class="section-title">Dark mode — backgrounds</div>
<div class="grid" style="margin-bottom:14px">
  <div class="row"><div class="swatch" style="background:#111110; border-color:rgba(255,255,255,0.15)"></div><div class="info"><span class="name">--bg</span><span class="hex">#111110</span></div></div>
  <div class="row"><div class="swatch" style="background:#1C1C1B"></div><div class="info"><span class="name">--bg-2</span><span class="hex">#1C1C1B</span></div></div>
  <div class="row"><div class="swatch" style="background:#282826"></div><div class="info"><span class="name">--bg-3</span><span class="hex">#282826</span></div></div>
</div>
<div class="section-title">Foregrounds</div>
<div class="grid" style="margin-bottom:14px">
  <div class="row"><div class="swatch" style="background:#F0F0EE"></div><div class="info"><span class="name">--fg</span><span class="hex">#F0F0EE</span></div></div>
  <div class="row"><div class="swatch" style="background:#8A8A88"></div><div class="info"><span class="name">--fg-2</span><span class="hex">#8A8A88</span></div></div>
  <div class="row"><div class="swatch" style="background:#555554"></div><div class="info"><span class="name">--fg-3</span><span class="hex">#555554</span></div></div>
</div>
<div class="section-title">Accent dark</div>
<div class="grid">
  <div class="row"><div class="swatch" style="background:#3B82F6"></div><div class="info"><span class="name">--accent</span><span class="hex">#3B82F6</span></div></div>
  <div class="row"><div class="swatch" style="background:#34D399"></div><div class="info"><span class="name">--green</span><span class="hex">#34D399</span></div></div>
  <div class="row"><div class="swatch" style="background:#2A2A28"></div><div class="info"><span class="name">--border</span><span class="hex">#2A2A28</span></div></div>
</div>
</body>
</html>
