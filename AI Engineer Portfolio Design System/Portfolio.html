<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --bg:   #FAFAF9; --bg-2: #F2F2F0; --bg-3: #E8E8E6;
  --fg:   #111110; --fg-2: #6B6B69; --fg-3: #ABABAA;
  --border: #E2E2E0;
  --accent: #1C64F2; --accent-h: #1A56DB; --accent-s: #EFF6FF;
  --green: #059669;  --green-s: #ECFDF5;
  --radius: 4px; --radius-sm: 2px;
  --shadow: 0 4px 16px rgba(0,0,0,.07);
  --dur: 150ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg:   #111110; --bg-2: #1C1C1B; --bg-3: #282826;
  --fg:   #F0F0EE; --fg-2: #8A8A88; --fg-3: #555554;
  --border: #2A2A28;
  --accent: #3B82F6; --accent-h: #60A5FA; --accent-s: #1E3A5F;
  --green: #34D399;  --green-s: #064E3B;
  --shadow: 0 4px 16px rgba(0,0,0,.35);
}}
:root[data-theme="dark"] {
  --bg:   #111110; --bg-2: #1C1C1B; --bg-3: #282826;
  --fg:   #F0F0EE; --fg-2: #8A8A88; --fg-3: #555554;
  --border: #2A2A28;
  --accent: #3B82F6; --accent-h: #60A5FA; --accent-s: #1E3A5F;
  --green: #34D399;  --green-s: #064E3B;
  --shadow: 0 4px 16px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  --bg:   #FAFAF9; --bg-2: #F2F2F0; --bg-3: #E8E8E6;
  --fg:   #111110; --fg-2: #6B6B69; --fg-3: #ABABAA;
  --border: #E2E2E0;
  --accent: #1C64F2; --accent-h: #1A56DB; --accent-s: #EFF6FF;
  --green: #059669;  --green-s: #ECFDF5;
  --shadow: 0 4px 16px rgba(0,0,0,.07);
}

html, body, #root { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Tweaks panel ── */
#tw {
  display: none; position: fixed; bottom: 20px; right: 20px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 16px 18px; width: 210px;
  box-shadow: var(--shadow); z-index: 999; font-size: 12px;
}
#tw.on { display: block; }
#tw .th { font-size: 10px; font-weight: 500; color: var(--fg); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
#tw label { display: block; margin-bottom: 10px; font-size: 11px; color: var(--fg-3); }
#tw label span { display: block; margin-bottom: 4px; }
#tw select, #tw input[type=text] {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 5px 8px; color: var(--fg); font-size: 11px;
  font-family: var(--font); outline: none;
}
</style>

function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function App() {
  const [page, setPage] = useState(() => localStorage.getItem('av-page') || 'about');
  const [name, setName] = useState('Алексей Викулин');
  const [theme, setTheme] = useState(() => localStorage.getItem('av-theme') || 'system');

  const resolvedTheme = theme === 'system' ? getSystemTheme() : theme;

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', resolvedTheme);
  }, [resolvedTheme]);

  const toggleTheme = useCallback(() => {
    const next = resolvedTheme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    localStorage.setItem('av-theme', next);
  }, [resolvedTheme]);

  const goTo = useCallback((p) => {
    setPage(p);
    localStorage.setItem('av-page', p);
    const twPage = document.getElementById('tw-page');
    if (twPage) twPage.value = p;
    window.scrollTo({ top: 0 });
  }, []);

  useEffect(() => {
    const twPage = document.getElementById('tw-page');
    const twName = document.getElementById('tw-name');
    if (twPage) {twPage.value = page;twPage.addEventListener('change', (e) => goTo(e.target.value));}
    if (twName) twName.addEventListener('input', (e) => setName(e.target.value));

    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tw')?.classList.add('on');
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tw')?.classList.remove('on');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const pages = { about: <AboutPage setPage={goTo} />, work: <WorkPage />, writing: <WritingPage />, now: <NowPage />, cv: <CVPage />, contact: <ContactPage /> };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav active={page} setPage={goTo} name={name} theme={resolvedTheme} toggleTheme={toggleTheme} />
      <main style={{ flex: 1, maxWidth: 760, width: '100%', margin: '0 auto', padding: '0 48px' }} data-screen-label={page}>
        {pages[page]}
      </main>
      <div style={{ maxWidth: 760, width: '100%', margin: '0 auto', padding: '0 48px' }}>
        <Divider />
      </div>
      <div style={{ maxWidth: 760, width: '100%', margin: '0 auto' }}>
        <Footer name={name} />
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
